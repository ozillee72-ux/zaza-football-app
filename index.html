<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09265a">
<meta name="description" content="Pintu masuk rasmi ZAZA House of Football ke Dashboard Liga Bola Sepak.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZAZA FOOTBALL">
<link rel="manifest" href="./manifest.webmanifest">

<title>ZAZA HOUSE OF FOOTBALL</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 15%,#215fbe 0%,#09265a 45%,#06112a 100%);color:#fff;display:grid;place-items:center;padding:22px}main{width:min(100%,440px);text-align:center}.logo{display:block;width:min(66vw,248px);height:auto;margin:0 auto 20px;border-radius:24%;box-shadow:0 18px 48px #0008}h1{font-size:clamp(25px,7vw,36px);line-height:1.13;margin:0;color:#ffd778;letter-spacing:.6px}p{color:#dbe9ff;line-height:1.55}.cta{display:block;text-decoration:none;margin:26px auto 14px;padding:17px 22px;border-radius:14px;background:linear-gradient(120deg,#e9b847,#ffe8a0,#d9a32f);color:#102d5d;font-weight:900;box-shadow:0 9px 26px #0006}.secondary{background:transparent;border:1px solid #86b4f7;color:#e7f1ff;border-radius:12px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer}.help{margin-top:20px;padding:14px;background:#ffffff12;border:1px solid #ffffff28;border-radius:14px;font-size:13px;text-align:left}.help strong{color:#ffdf8c}footer{font-size:12px;color:#aec7ee;margin-top:20px}
</style>
</head>
<body><main>
<img class="logo" src="./icons/zaza-house-512.png" alt="Logo ZAZA House of Football">
<h1>ZAZA<br>HOUSE OF FOOTBALL</h1>
<p>One Stop Centre Liga Bola Sepak</p>
<a class="cta" href="https://script.google.com/macros/s/AKfycbyHNzbcEPN1mL4qIQFPfjD6fPwuSOxyWGqeZB-zmHemFwn7tjZWfLzcup29E_puTHI/exec">⚽ BUKA DASHBOARD LIGA</a>
<button class="secondary" type="button" id="install" hidden>⬇ PASANG APLIKASI</button>

<footer>© ZAZA HOUSE OF FOOTBALL</footer>
</main>
<script>
let deferredPrompt;const install=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.hidden=false});
install.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.hidden=true});
window.addEventListener('appinstalled',()=>{install.hidden=true;deferredPrompt=null});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
